version: '3.8'

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - JWT_SECRET=your-super-secret-key-for-development-only-change-in-production
      - JWT_EXPIRES_IN=24h
      - SEED_TESTUSER_1_PASSWORD=TestUser1@2024
      - SEED_TESTUSER_2_PASSWORD=TestUser2@2024
      - SEED_ADMIN_1_PASSWORD=AdminUser1@2024
      - RATE_LIMIT_ENABLED=false
      - ACL_ENABLED=true
    volumes:
      - api_data:/app/data
      - api_db:/app/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  api_data:
  api_db:

networks:
  default:
    driver: bridge