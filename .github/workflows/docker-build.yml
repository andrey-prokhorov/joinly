name: Docker Build & Test

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]

concurrency:
  group: docker-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-api-docker:
    name: Build API Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: false
          tags: joinly-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test API Docker image
        run: |
          # Start the container in background
          docker run -d --name test-api \
            -p 3001:3001 \
            -e NODE_ENV=test \
            -e JWT_SECRET=test-secret-key-for-docker-testing-only \
            -e JWT_EXPIRES_IN=24h \
            -e SEED_TESTUSER_1_PASSWORD=TestUser1@2024 \
            -e SEED_TESTUSER_2_PASSWORD=TestUser2@2024 \
            -e SEED_ADMIN_1_PASSWORD=AdminUser1@2024 \
            -e RATE_LIMIT_ENABLED=false \
            -e ACL_ENABLED=true \
            joinly-api:test

          # Wait for container to start
          sleep 30

          # Test health endpoint
          curl -f http://localhost:3001/health || exit 1

          # Cleanup
          docker stop test-api
          docker rm test-api

  build-app-docker:
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          tags: joinly-app:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Frontend Docker image
        run: |
          # Start the container in background
          docker run -d --name test-app \
            -p 3000:3000 \
            joinly-app:test

          # Wait for container to start
          sleep 30

          # Test that frontend serves content
          curl -f http://localhost:3000/ || exit 1

          # Cleanup
          docker stop test-app
          docker rm test-app

  test-docker-compose:
    name: Test Docker Compose
    runs-on: ubuntu-latest
    needs: [build-api-docker, build-app-docker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker Compose
        run: |
          # Start services with docker-compose
          docker-compose up -d

          # Wait for services to be ready
          sleep 60

          # Test API health
          curl -f http://localhost:3001/health || exit 1

          # Test frontend
          curl -f http://localhost:3000/ || exit 1

          # Show logs for debugging if needed
          docker-compose logs

          # Cleanup
          docker-compose down -v