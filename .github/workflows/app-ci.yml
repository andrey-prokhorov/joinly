name: APP CI

on:
  pull_request:
    branches: ["**"]
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"

concurrency:
  group: app-app-ci-${{ github.event.pull_request.number }}  
  cancel-in-progress: true

jobs:
  npm-audit:
    name: Frontend security audit (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

  frontend-tests:
    name: Frontend (Vitest) unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm run test:ci
