name: Deploy to Railway

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: railway-deploy
  cancel-in-progress: true

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  deploy-api:
    name: Deploy API to Railway
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API to Railway
        working-directory: ./api
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          
  deploy-app:
    name: Deploy Frontend to Railway
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: deploy-api
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Frontend to Railway
        working-directory: ./app
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  health-check:
    name: Health Check Deployments
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-app]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Wait for deployments
        run: sleep 60

      - name: Check API Health
        run: |
          if [ ! -z "${{ secrets.RAILWAY_API_URL }}" ]; then
            curl -f ${{ secrets.RAILWAY_API_URL }}/health || exit 1
          else
            echo "RAILWAY_API_URL secret not set, skipping health check"
          fi

      - name: Check Frontend Health
        run: |
          if [ ! -z "${{ secrets.RAILWAY_APP_URL }}" ]; then
            curl -f ${{ secrets.RAILWAY_APP_URL }}/ || exit 1
          else
            echo "RAILWAY_APP_URL secret not set, skipping health check"
          fi