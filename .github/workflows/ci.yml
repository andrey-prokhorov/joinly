name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: Frontend security audit (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Show directory tree (depth 4)
        run: tree -L 4

      - name: Show current working directory
        run: pwd      

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
       
      - name: Run npm audit
        run: npm audit --audit-level=high

  frontend-tests:
    name: Frontend (Vitest) unit tests
    runs-on: ubuntu-latest
    # needs: [npm-audit]    
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm run test:ci

  api-audit:
    name: API security audit (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --omit=dev: Newman (test runner) har kända sårbarheter i sina dependencies
      # som inte påverkar produktion. Vi auditerar därför bara prod-dependencies.
      # Se api/README.md för mer info.
      - name: Run npm audit (production dependencies only)
        run: npm audit --omit=dev --audit-level=high

  api-lint-build:
    name: API lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Build TypeScript
        run: npm run build

  api-integration-tests:
    name: API integration tests (Newman)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      SEED_TESTUSER_1_PASSWORD: ${{ secrets.SEED_TESTUSER_1_PASSWORD }}
      SEED_TESTUSER_2_PASSWORD: ${{ secrets.SEED_TESTUSER_2_PASSWORD }}
      SEED_ADMIN_1_PASSWORD: ${{ secrets.SEED_ADMIN_1_PASSWORD }}
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Start server in background
        run: npm start &

      - name: Wait for server to be ready
        run: |
          echo "Waiting for server..."
          for i in {1..30}; do
            if curl -s http://localhost:3001/api/health > /dev/null; then
              echo "Server is ready!"
              exit 0
            fi
            echo "Attempt $i/30..."
            sleep 1
          done
          echo "Server failed to start"
          exit 1

      - name: Run Newman tests
        run: npm run test:api

      - name: Generate Swagger docs
        run: npm run openapi:gen        